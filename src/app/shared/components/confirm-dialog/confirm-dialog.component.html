<div class="fixed w-full inset-0 z-999 flex items-center justify-center bg-black/50 p-4 font-geist">
  <div class="relative w-75 sm:w-lg">
    <!-- Modal content -->
    <div class="relative bg-neutral-primary-soft rounded-base shadow-xl p-4 md:p-6 text-center">
      <!-- Modal header (Close button) -->
      <div class="flex justify-end">
        <button
          (click)="cancel()"
          type="button"
          class="text-gray-400 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center cursor-pointer"
        >
          <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
            />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>

      <!-- Modal body -->
      <div class="flex flex-col items-center space-y-4 py-2">
        <!-- Icon Wrapper with Dynamic Colors -->
        <div
          class="w-16 h-16 sm:w-20 sm:h-20 rounded-full flex items-center justify-center"
          [class]="{
            'bg-red-50': type() === 'danger',
            'bg-amber-50': type() === 'warning',
            'bg-blue-50': type() === 'info',
          }"
        >
          <div
            class="w-12 h-12 sm:w-14 sm:h-14 rounded-full flex items-center justify-center"
            [class]="{
              'bg-red-100': type() === 'danger',
              'bg-amber-100': type() === 'warning',
              'bg-blue-100': type() === 'info',
            }"
          >
            <!-- Custom Icon / Default Warning SVG -->
            @if (icon()) {
              <div
                [class]="{
                  'text-red-600': type() === 'danger',
                  'text-amber-600': type() === 'warning',
                  'text-blue-600': type() === 'info',
                }"
              >
                <i [class]="icon()" class="text-xl"></i>
              </div>
            } @else {
              <svg
                class="w-6 h-6 sm:w-8 sm:h-8"
                [class]="{
                  'text-red-600': type() === 'danger',
                  'text-amber-600': type() === 'warning',
                  'text-blue-600': type() === 'info',
                }"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                />
              </svg>
            }
          </div>
        </div>

        <!-- Title & Message -->
        <h3
          class="text-lg sm:text-xl font-bold"
          [class]="{
            'text-red-600': type() === 'danger',
            'text-amber-600': type() === 'warning',
            'text-blue-600': type() === 'info',
          }"
        >
          {{ title() }}
        </h3>
        <p class="text-sm text-gray-500">{{ message() }}</p>
      </div>

      <!-- Modal footer -->
      <div class="grid grid-cols-2 gap-4 pt-6 mt-4 border-t border-default">
        <button
          (click)="cancel()"
          type="button"
          class="w-full text-gray-700 bg-gray-200 hover:bg-gray-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors cursor-pointer"
        >
          {{ cancelButtonText() }}
        </button>
        <button
          (click)="submit()"
          type="button"
          class="w-full text-white font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors cursor-pointer"
          [class]="
            type() === 'danger'
              ? 'bg-red-600 hover:bg-red-700'
              : type() === 'warning'
                ? 'bg-amber-600 hover:bg-amber-700'
                : type() === 'info'
                  ? 'bg-blue-600 hover:bg-blue-700'
                  : ''
          "
        >
          {{ confirmButtonText() }}
        </button>
      </div>
    </div>
  </div>
</div>
