<article
  class="relative flex font-geist mb-4 flex-col md:flex-row items-stretch gap-4 bg-blue-50 p-4 border border-slate-200/60 shadow-xs hover:shadow-md transition-all duration-200"
>
  <!-- Exam Logo Box -->
  <div
    class="flex h-15 w-15 shrink-0 items-center justify-center rounded-lg bg-blue-100/60 p-3 self-center md:self-stretch"
  >
    <img [src]="card().image" [alt]="card().title" class="h-16 w-16 object-contain" />
  </div>

  <!-- Content & Metadata Container -->
  <div class="flex flex-1 flex-col gap-3 min-w-0">
    <!-- Header: Title & Badges -->
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-xl font-semibold text-blue-600 tracking-wide">
        <a
          routerLink=""
          class="hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500 rounded"
        >
          {{ card().title }}
        </a>
      </h2>

      <!-- Info Badges -->
      <div class="flex items-center gap-4 text-sm font-medium text-gray-700">
        <div class="flex items-center gap-1.5" title="Total Questions">
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M12 18h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
          <span
            ><strong class="font-semibold">{{ card().questionsCount }}</strong> Questions</span
          >
        </div>

        <div class="flex items-center gap-1.5 text-gray-700" title="Exam Duration">
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
          <span
            ><strong class="font-semibold">{{ card().duration }}</strong> minutes</span
          >
        </div>
      </div>
    </div>

    <!-- Exam Description Text -->
    <p class="text-xs leading-relaxed text-slate-500 line-clamp-3">
      {{ card().description }}
    </p>
  </div>
</article>
