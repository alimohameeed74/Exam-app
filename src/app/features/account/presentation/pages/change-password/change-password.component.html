<section
  aria-labelledby="change-password"
  class="bg-white border border-gray-300 p-4 sm:p-6 lg:p-8"
>
  <h2 id="change-password" class="sr-only">Change Password</h2>

  <form>
    <div class="">
      <!-- Current Password -->
      <div class="mb-4">
        <app-shared-input
          [control]="passwordController"
          [obj]="{
            id: 'password-2',
            label: 'Current Password:',
            type: 'password',
            placeHolder: '•••••••',
          }"
        ></app-shared-input>
      </div>

      <!-- New Password -->
      <div class="mb-4">
        <app-shared-input
          [control]="passwordController"
          [obj]="{
            id: 'newPassword',
            label: 'New Password:',
            type: 'password',
            placeHolder: '•••••••',
          }"
        ></app-shared-input>
      </div>
      <!-- Confirm New Password -->
      <div class="mb-4">
        <app-shared-input
          [control]="passwordController"
          [obj]="{
            id: 'confirmNewPassword',
            label: 'Confirm New Password:',
            type: 'password',
            placeHolder: '•••••••',
          }"
        ></app-shared-input>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-8">
      <button
        type="submit"
        class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors disabled:opacity-50"
      >
        Update Password
      </button>
    </div>
  </form>
</section>
