<section
  aria-labelledby="profile-heading"
  class="bg-white border border-gray-300 p-4 sm:p-6 lg:p-8"
>
  <h2 id="profile-heading" class="sr-only">Profile Settings</h2>

  <form>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6">
      <!-- First name -->
      <app-shared-input
        [control]="passwordController"
        [obj]="{ id: 'firstName', label: 'First name:', type: 'text', placeHolder: 'ali' }"
      ></app-shared-input>

      <!-- Last name -->

      <app-shared-input
        [control]="passwordController"
        [obj]="{ id: 'lastName', label: 'Last name:', type: 'text', placeHolder: 'mohamed' }"
      ></app-shared-input>

      <!-- Username -->
      <div class="relative sm:col-span-2">
        <app-shared-input
          [control]="passwordController"
          [obj]="{ id: 'username', label: 'Username:', type: 'text', placeHolder: 'mohamed' }"
        ></app-shared-input>
      </div>

      <!-- Email -->
      <div class="relative sm:col-span-2">
        <div class="absolute right-0">
          <button
            type="button"
            class="flex items-center gap-1 text-sm text-blue-600 hover:text-blue-700 font-medium"
          >
            <svg
              class="w-3.5 h-3.5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
              />
            </svg>
            Change
          </button>
        </div>

        <app-shared-input
          [control]="passwordController"
          [obj]="{ id: 'email', label: 'Email:', type: 'email', placeHolder: 'mohamed' }"
        ></app-shared-input>
      </div>

      <!-- Phone -->
      <div class="sm:col-span-2">
        <app-shared-input
          [control]="passwordController"
          [obj]="{
            id: 'phone',
            label: 'Phone:',
            type: 'tel',
            placeHolder: '01xxxxxxxxx',
          }"
        ></app-shared-input>
      </div>
    </div>

    <!-- Actions -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8">
      <button
        type="button"
        class="w-full rounded-lg bg-red-50 text-red-500 hover:bg-red-100 font-medium text-sm py-3 transition-colors"
      >
        Delete My Account
      </button>

      <button
        type="submit"
        class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-3 text-center transition-colors disabled:opacity-50"
      >
        Save Changes
      </button>
    </div>
  </form>
</section>
