<header class="flex items-center gap-3 mb-4 font-inter">
  <!-- Back Navigation Button -->
  <button
    (click)="back()"
    aria-label="Go back to Previous Page"
    class="flex h-19 w-19 items-center justify-center rounded-xl border border-blue-200 bg-white text-blue-600 shadow-xs hover:bg-blue-50 transition-all shrink-0"
  >
    <svg
      class="h-5 w-5"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
  </button>

  <!-- Header Banner -->
  <div class="flex flex-1 items-center gap-3 bg-[#2F5BEA] text-white px-5 py-4 shadow-sm text-3xl">
    <!-- Banner Icon Box -->
    <div class="hidden sm:flex h-10 w-10 items-center justify-center" aria-hidden="true">
      <i class="text-white fa-regular fa-user"></i>
    </div>
    <!-- Page Main Title -->
    <h2 class="text-lg md:text-2xl font-bold tracking-tight">Account Settings</h2>
  </div>
</header>
<div class="flex flex-col xl:flex-row mb-4 xl:mb-0 bg-gray-50 h-fit xl:h-137.5 overflow-hidden">
  <!-- Sidebar navigation -->
  <aside
    class="w-full mb-4 xl:mb-0 xl:w-64 bg-white xl:me-4 border border-gray-300 flex flex-col justify-between"
  >
    <nav aria-label="Account navigation" class="p-4 w-full">
      <ul class="space-y-1 font-geist">
        <li>
          <a
            routerLink="profile"
            routerLinkActive="bg-blue-100 border border-[#2F5BEA]/30 text-blue-600!"
            class="flex items-center gap-3 text-gray-600 hover:text-gray-900 px-3 py-2.5 font-medium transition-colors"
            aria-current="page"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            Profile
          </a>
        </li>
        <li>
          <a
            routerLink="change-password"
            routerLinkActive="bg-blue-100 border border-[#2F5BEA]/30 text-blue-600!"
            class="flex items-center gap-3 text-gray-600 hover:text-gray-900 px-3 py-2.5 font-medium transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
              />
            </svg>
            Change Password
          </a>
        </li>
      </ul>
    </nav>

    <!-- Logout button -->
    <div class="px-4 pb-4 pt-0 w-full xl:mt-auto">
      <button
        (click)="logout()"
        class="flex w-full items-center gap-3 px-4 py-2.5 rounded-lg bg-red-50 text-red-500 hover:bg-red-100 font-medium text-sm transition-colors"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main id="profile" class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
